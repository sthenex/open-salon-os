name: Bug report
description: Report reproducible behavior that differs from the documented result.
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: "Do not include real customer data, credentials, or private screenshots. Report security issues through a private advisory."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior using fictional data.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: "1. Open …\n2. Select …\n3. Observe …"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment profile
      options:
        - Local Docker evaluation
        - Single-node production
        - Managed production
        - Edge adapter
        - Not sure
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Browser and environment
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials and real personal/business data.
          required: true

